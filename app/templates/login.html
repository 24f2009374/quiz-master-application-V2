<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="stylesheet", href="{{ url_for('static', filename='css/asset.css') }}">
</head>
<body class="bg-black bg-gradient">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    

    <div id="app" v-cloak class="container mt-5">
        <div class="container">
            <div v-if="error" class="alert alert-danger alert-dismissible fade show" role="alert">
                        Error: {% raw %} {{ error }} {% endraw %}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>

        <div class="rounded-box-purple container w-50 text-light shadow-lg"   style="background-color: rgb(15,15,15); margin-top: 200px; padding:0px; margin-bottom: 340px;">
            <div class="text-center">
                <h2 class="my-3" style="padding-top: 15px;">Login Account</h2>
                <p class="lead">Login Now to Access Quizzes and More!</p>
            </div>
            <div class="row justify-content my-3">
                <div class="col-lg-6 mx-auto">
                    <form @submit.prevent="loginUser" class="needs-validation">                   
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" v-model="form.email" class="form-control" required>
                        </div>                    
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" v-model="form.password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                </div>
            </div>
        </div>     
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script> 
</body>
</html>
