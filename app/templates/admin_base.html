<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet", href="{{ url_for('static', filename='css/asset.css') }}">
    {% block links %}{% endblock %}

    <style>
        body {
            background-color: #212229;
            color: white;
        }

        .navbar-custom {
            background-color: #000000; 
        }
        .navbar .nav-link,
        .navbar .navbar-brand,
        .navbar .form-control,
        .navbar {
            color: white;
        }
        .navbar .nav-link:hover,
        .navbar .navbar-brand:hover {
            color: #cfcfcf;
        }

    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom px-4"  style="border-bottom: solid 5px transparent; border-image: linear-gradient(to right, rgb(16, 24, 134), rgb(43, 50, 150)); border-image-slice: 1;">
        <div class="container-fluid">
            <!--Left Links-->
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="{{ url_for('main.create_subject') }}">Create Subject</a>
                <a class="nav-link" href="{{ url_for('main.view_chapters') }}">View Chapters</a>
                <a class="nav-link" href="{{ url_for('main.view_quizzes') }}">All Quizzes</a>
                <a class="nav-link" href="{{ url_for('main.view_users') }}">All Users</a>
                <a class="nav-link" href="{{ url_for('main.admin_dashboard') }}">To Dashboard</a>
            </div>

            <!-- Center search (TBA) -->
            <form class="d-flex mx-3" role="search" style="max-width: 300px; padding-right: 50px;">
                <input class="form-control form-control-sm" type="search" placeholder="Search (Coming Soon)" aria-label="Search" disabled>
            </form>

            <!-- Right side: -->
            <div class="d-flex align-items-center gap-3">
                <span class="text-white">Welcome, Admin</span>
                <a class="btn btn-sm btn-danger" href="{{ url_for('main.logout') }}">Logout</a>
                <span class="navbar-brand ms-3">QuizMaster</span>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}

        {% endblock %}
    </div>

</body>
</html>
