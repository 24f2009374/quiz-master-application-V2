{% extends "admin_base.html" %}

{% block title %}Update Chapter{% endblock %}

{%block content%}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<div id="app" class="container mt-5" v-cloak>
    <div>
        <button @click="goBack" class="btn btn-secondary">← Back</button>
    </div>
    <div class="container">
        <div v-if="error" class="alert alert-danger alert-dismissible fade show" role="alert">
                    Error: <span v-text="error"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <div class="container">
        <div v-if="success" class="alert alert-success alert-dismissible fade show" role="alert">
            Success: <span v-text="success"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

        <div class="rounded-box-purple container w-50 text-light shadow-lg"   style="background-color: rgb(15,15,15); padding:0px; margin-bottom: 200px;">
            <div class="text-center">
                <h2 class="my-3" style="padding-top: 15px;">Update Chapter</h2>
                <p class="lead">Chapters House Quizzes</p>
            </div>
            <div class="row justify-content my-3">
                <div class="col-lg-6 mx-auto">
                    <form @submit.prevent="submitForm" class="needs-validation">
                        <div class="mb-3">
                            <label class="form-label">Chapter Name</label>
                            <input type="text" v-model="form.chap_name" class="form-control" required>
                        </div>                   
                        <div class="mb-3">
                            <label class="form-label">Chapter Description</label>
                            <input type="text" v-model="form.chap_text" class="form-control" required>
                        </div>                    
                        
                        <button type="submit" class="btn btn-success">Update</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="{{ url_for('static', filename='js/update_chapter.js') }}"></script>
{% endblock %}
