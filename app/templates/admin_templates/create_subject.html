{% extends "admin_base.html" %}

{% block title %}Subjecr Creation{% endblock %}

{%block content%}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<div id="app" class="container mt-5" v-cloak>
        <div class="container">
            <div v-if="error" class="alert alert-danger alert-dismissible fade show" role="alert">
                        Error: {% raw %} {{ error }} {% endraw %}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>

        <div class="container">
            <div v-if="success" class="alert alert-success alert-dismissible fade show" role="alert">
                        Success:{% raw %} {{ success }} {% endraw %}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
        </div>

        <!--Register Box-->
        <div class="rounded-box-purple container w-50 text-light shadow-lg"   style="background-color: rgb(15,15,15); margin-top: 200px; padding:0px; margin-bottom: 200px;">
            <div class="text-center">
                <h2 class="my-3" style="padding-top: 15px;">Create Subject</h2>
                <p class="lead">Subjects House Chapters</p>
            </div>
            <div class="row justify-content my-3">
                <div class="col-lg-6 mx-auto">
                    <form @submit.prevent="submitForm" class="needs-validation">
                        <div class="mb-3">
                            <label class="form-label">Subject Name</label>
                            <input type="text" v-model="form.sub_name" class="form-control" required>
                        </div>                   
                        <div class="mb-3">
                            <label class="form-label">Subject Description</label>
                            <input type="text" v-model="form.sub_text" class="form-control" required>
                        </div>                    
                        
                        <button type="submit" class="btn btn-success">Create</button>
                    </form>
                </div>
            </div>
        </div>
    </div>




<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<!--<script src="{{ url_for('static', filename='js/admin_dash.js') }}"></script> -->
<script>
const { createApp, ref } = Vue;
        createApp({
            setup(){
                const form = ref({ sub_name:'', sub_text:'' });

                const error= ref('');
                const success= ref('');

                const submitForm = async () => {
                    error.value=''; success.value='';

                    try {
                        const response= await axios.post('/api/subjects/crud', {sub_name:form.value.sub_name, sub_desc:form.value.sub_text});
                        success.value=response.data.message;
                        console.log(success.value);

                        form.value={ sub_name:'', sub_text:'' };


                    } catch(err) {
                        if (err.response && err.response.data && err.response.data.error) {
                            error.value = err.response.data.error;
                        } else {
                            error.value = "Creation failed.";
                    }
                    }

                };

                return {
                    form,
                    error,
                    success,
                    submitForm
                };
            }
        }).mount("#app");
</script>

{% endblock %}
